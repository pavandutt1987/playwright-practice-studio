<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playground - File Upload & Drag & Drop</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --muted: #94a3b8;
            --primary: #38bdf8;
            --border: #334155;
            --success: #22c55e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 40px 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; }
        .badge { display: inline-block; background: rgba(56, 189, 248, 0.1); color: var(--primary); font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 9999px; margin-bottom: 12px; }
        h1 { font-size: 24px; margin-bottom: 6px; }
        p.subtitle { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 28px; }
        .upload-zone {
            border: 2px dashed var(--border); border-radius: 8px; padding: 36px 20px; text-align: center; background: #0b1120; cursor: pointer; transition: border-color 0.2s; margin-bottom: 20px;
        }
        .upload-zone:hover { border-color: var(--primary); }
        .upload-zone p { color: var(--muted); font-size: 14px; margin-top: 8px; }
        .btn {
            width: 100%; background: var(--primary); color: #0f172a; font-weight: 600; padding: 12px; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        #uploadStatus { margin-top: 18px; padding: 12px; background: rgba(34, 197, 94, 0.15); border: 1px solid var(--success); color: var(--success); border-radius: 6px; display: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <span class="badge">Offline Mock Target</span>
        <h1>File Upload Automation</h1>
        <p class="subtitle">Practice setting input files, triggering file choosers, and asserting file upload state.</p>

        <div class="card">
            <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
                <div style="font-size: 32px;">📁</div>
                <p>Click or set file on the input element</p>
                <input type="file" id="fileInput" name="uploadedFile" style="display: block; margin: 15px auto 0 auto; color: var(--muted);" />
            </div>

            <button class="btn" onclick="submitUpload()">Upload File</button>

            <div id="uploadStatus"></div>
        </div>
    </div>

    <script>
        function submitUpload() {
            const fileInput = document.getElementById("fileInput");
            const status = document.getElementById("uploadStatus");

            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                status.style.display = "block";
                status.innerHTML = `✅ Successfully uploaded file: <strong>${file.name}</strong> (${(file.size / 1024).toFixed(1)} KB)`;
            } else {
                status.style.display = "block";
                status.style.borderColor = "#ef4444";
                status.style.color = "#ef4444";
                status.style.background = "rgba(239, 68, 68, 0.15)";
                status.innerText = "❌ Please select a file before uploading!";
            }
        }
    </script>
</body>
</html>
